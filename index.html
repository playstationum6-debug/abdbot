<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ABD·BOT">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ABD·BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--tx:#fff;--mu:#8e8e93;--ln:#2c2c2e;--up:#30d158;--dn:#ff453a;--am:#ffd60a;--ac:#0a84ff;--vi:#5e5ce6;
--sp:cubic-bezier(.32,.72,0,1);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--am)}.mu{color:var(--mu)}
.num{font-variant-numeric:tabular-nums}
/* ekranlar */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--safe-t) + 8px) 0 calc(var(--safe-b) + 100px);-webkit-overflow-scrolling:touch;
  transition:transform .5s var(--sp),opacity .35s ease;will-change:transform}
.scr.gizli{opacity:0;pointer-events:none;transform:scale(.97)}
/* küçük başlık (kaydırınca) */
.mini{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 10px) 16px 10px;text-align:center;font-weight:700;font-size:17px;
  background:rgba(0,0,0,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;
  opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s,border-color .25s;pointer-events:none}
.mini.on{opacity:1;transform:none;border-color:var(--ln)}
.lt{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 16px 0}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.6px;transition:transform .3s var(--sp)}
.sub{padding:2px 16px 12px;color:var(--mu);font-size:15px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--vi));display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 4px 14px #0a84ff55}
/* hikâye halkaları */
.st{display:flex;gap:14px;padding:4px 16px 16px;overflow-x:auto;scrollbar-width:none}.st::-webkit-scrollbar{display:none}
.st .h{flex:none;text-align:center;font-size:12px;font-weight:600;width:64px;animation:gir .6s var(--sp) both}
.ring{position:relative;width:64px;height:64px;margin-bottom:6px}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}.ring .bg{stroke:var(--c3)}.ring .fg{transition:stroke-dashoffset 1.2s var(--sp)}
.ring b{position:absolute;inset:6px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.3px}
.ring.kir b{background:#0d2e19}.ring.yak{animation:nabiz 1.6s ease-in-out infinite}
@keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* kartlar */
.hero{margin:0 16px;border-radius:22px;padding:18px;background:linear-gradient(135deg,#1c1c1e 0%,#232336 100%);position:relative;overflow:hidden;animation:gir .7s var(--sp) both .05s}
.hero::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 80% 20%,#5e5ce633,transparent 40%);animation:dolas 9s linear infinite}
@keyframes dolas{to{transform:rotate(360deg)}}
.hero small{color:var(--mu);font-size:13px;font-weight:700;letter-spacing:.4px}.hero .n{font-size:40px;font-weight:800;margin:2px 0 4px;letter-spacing:-1px;position:relative;z-index:1}
#hW{font-size:20px}.hero p{color:var(--mu);font-size:13px;position:relative;z-index:1}
.seg{margin:18px 16px 4px;background:var(--c1);border-radius:10px;display:flex;padding:2px;position:relative}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:#636366;transition:transform .35s var(--sp),width .35s var(--sp);box-shadow:0 3px 8px #0006}
.seg button{flex:1;padding:7px;font-size:13px;font-weight:600;position:relative;z-index:1;color:#ebebf5}
.row{display:flex;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--ln);animation:gir .5s var(--sp) both;transition:background .2s}
.row:active{background:var(--c1)}
.row .n{flex:1;min-width:0}.row .n b{font-size:17px;letter-spacing:-.2px}.row .n small{display:block;color:var(--mu);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row svg.sp{margin:0 12px;flex:none}
.pr{min-width:82px;text-align:center;padding:7px 8px;border-radius:9px;font-weight:700;font-size:15px;transition:background .4s,color .4s,transform .2s}
.pr.y{background:var(--am);color:#000}.pr.g{background:var(--up);color:#000}.pr.r{background:var(--dn);color:#fff}.pr.n{background:var(--c2)}
.flU{animation:flU .9s}.flD{animation:flD .9s}
@keyframes flU{0%{box-shadow:0 0 0 0 #30d158aa;transform:scale(1.08)}100%{box-shadow:0 0 0 14px #30d15800;transform:none}}
@keyframes flD{0%{box-shadow:0 0 0 0 #ff453aaa;transform:scale(1.08)}100%{box-shadow:0 0 0 14px #ff453a00;transform:none}}
@keyframes gir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bos{padding:40px 24px;text-align:center;color:var(--mu);font-size:15px;line-height:1.5}
.bos .e{font-size:44px;margin-bottom:8px;animation:yuzer 3s ease-in-out infinite}
@keyframes yuzer{50%{transform:translateY(-8px)}}
/* iskelet */
.isk{height:62px;margin:0 16px 10px;border-radius:14px;background:linear-gradient(90deg,var(--c1) 0%,var(--c2) 50%,var(--c1) 100%);background-size:200% 100%;animation:parla 1.2s linear infinite}
@keyframes parla{to{background-position:-200% 0}}
/* sekme çubuğu */
.tab{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:7px 4px calc(var(--safe-b) + 6px);display:flex;justify-content:space-around;
  background:rgba(22,22,24,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid #38383a}
.tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--mu);transition:color .25s;position:relative}
.tab svg{width:26px;height:26px;transition:transform .45s var(--sp)}
.tab .on{color:var(--ac)}.tab .on svg{transform:translateY(-2px) scale(1.12)}
.tab .rozet{position:absolute;top:-2px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--dn);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 4px;animation:zipla .5s var(--sp)}
@keyframes zipla{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
/* detay (sağdan kayan sayfa) */
#det{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(100%);transition:transform .5s var(--sp);overflow-y:auto;padding:calc(var(--safe-t) + 4px) 0 calc(var(--safe-b) + 110px);box-shadow:-20px 0 40px #000}
#det.on{transform:none}
.scr.itik{transform:translateX(-28%);opacity:.5}
.nb{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--ac);font-size:17px;background:rgba(0,0,0,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nb button{color:var(--ac);font-size:17px;display:flex;align-items:center;gap:2px}
.dh{padding:4px 16px 0}.dh .s{font-size:15px;color:var(--mu);font-weight:600}.dh .p{font-size:46px;font-weight:800;letter-spacing:-1.4px;transition:color .3s}.dh .c{font-size:17px;font-weight:600}
.cw{position:relative;margin-top:6px;touch-action:pan-y}.cw svg{display:block;width:100%}
.cw .yol{stroke-dasharray:3000;stroke-dashoffset:3000;animation:ciz 1.6s var(--sp) forwards}@keyframes ciz{to{stroke-dashoffset:0}}
.cw .alan{opacity:0;animation:sol .8s ease .8s forwards}@keyframes sol{to{opacity:1}}
.tip{position:absolute;top:0;pointer-events:none;background:var(--c2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;transform:translateX(-50%);opacity:0;transition:opacity .15s;white-space:nowrap}
.rg{display:flex;justify-content:center;gap:8px;padding:8px 16px 14px}.rg button{font-size:13px;font-weight:700;color:var(--up);padding:4px 10px;border-radius:7px;transition:all .25s}.rg .on{background:var(--up);color:#000}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:99px;background:var(--c1);font-size:13px;font-weight:600;animation:gir .5s var(--sp) both}
.cd{margin:0 16px 12px;border-radius:16px;background:var(--c1);padding:14px 16px;animation:gir .55s var(--sp) both}
.cd h4{font-size:12px;color:var(--mu);margin-bottom:8px;letter-spacing:.5px;font-weight:700}
.r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:15px}.r+.r{border-top:.5px solid var(--c2)}
.bb{height:8px;border-radius:4px;background:var(--dn);overflow:hidden;margin:8px 0 4px}.bb i{display:block;height:100%;background:var(--up);border-radius:4px;transition:width 1s var(--sp)}
.ts{display:grid;grid-template-columns:62px 1fr auto;gap:6px;padding:5px 0;font-size:14px;animation:kay .4s var(--sp) both}
@keyframes kay{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.zn{position:relative;padding-left:18px;font-size:14px;line-height:1.9}.zn::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--c3);border-radius:1px}
.zn div{position:relative;animation:gir .45s var(--sp) both}.zn div::before{content:"";position:absolute;left:-17px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--c1)}
.cta{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 22px);z-index:55;display:flex;gap:10px;transform:translateY(140%);transition:transform .55s var(--sp) .1s}
#det.on~.cta{transform:none}
.cta button{flex:1;padding:16px;border-radius:15px;font-weight:700;font-size:16px;background:var(--up);color:#000;box-shadow:0 8px 24px #30d15844;transition:transform .15s}
.cta button:active{transform:scale(.96)}.cta button+button{background:var(--c2);color:#fff;box-shadow:none;flex:.6}
/* canlı */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:0 16px}
.cc{border-radius:18px;padding:14px;background:var(--c1);border:1.5px solid var(--c2);transition:all .5s var(--sp);animation:gir .5s var(--sp) both;position:relative;overflow:hidden}
.cc .s{font-size:20px;font-weight:800}.cc .p{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}.cc .l{font-size:12px;color:var(--mu)}
.cc .bar{height:5px;border-radius:3px;background:var(--c3);margin-top:10px;overflow:hidden}.cc .bar i{display:block;height:100%;background:var(--ac);transition:width 1s var(--sp)}
.cc.yak{border-color:var(--am);box-shadow:0 0 24px #ffd60a33}.cc.yak .bar i{background:var(--am)}
.cc.kir{border-color:var(--up);background:#0b1f12;box-shadow:0 0 26px #30d15840}.cc.kir .bar i{background:var(--up)}
.cc.sah,.cc.stp{opacity:.5}
.cc.kir::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#30d15822 50%,transparent 70%);animation:parla2 2.5s linear infinite;background-size:200% 100%}
@keyframes parla2{from{background-position:200% 0}to{background-position:-200% 0}}
.canlinokta{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dn);margin-right:6px;animation:yanson 1.2s infinite}
@keyframes yanson{50%{opacity:.25}}
/* bildirim */
.bl{display:flex;gap:12px;margin:0 16px 10px;padding:12px 14px;border-radius:18px;background:var(--c1);animation:gir .45s var(--sp) both}
.bl .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--ac),var(--vi))}
.bl b{font-size:15px;display:block}.bl p{font-size:14px;color:#c7c7cc;margin-top:2px}.bl small{float:right;color:var(--mu);font-size:12px}
.btn{display:block;margin:0 16px 16px;padding:14px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;text-align:center;font-size:16px;transition:transform .15s}.btn:active{transform:scale(.97)}
/* ada (üstten bildirim) */
#ada{position:fixed;top:calc(var(--safe-t) + 8px);left:50%;z-index:90;transform:translate(-50%,-160%) scale(.6);width:min(92vw,380px);border-radius:24px;background:#111;
  box-shadow:0 10px 40px #000c;padding:12px 16px;display:flex;gap:10px;align-items:center;transition:transform .6s var(--sp)}
#ada.on{transform:translate(-50%,0) scale(1)}#ada b{font-size:14px;display:block}#ada p{font-size:13px;color:#aaa}
/* karne */
.kr{display:flex;align-items:center;gap:18px;margin:0 16px 14px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#1c1c1e,#162a1e)}
.kr .big{position:relative;width:110px;height:110px;flex:none}.kr .big svg{transform:rotate(-90deg)}.kr .big b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;white-space:nowrap}.kr .big b small{font-size:16px;margin-left:1px;color:var(--mu)}
.kr .big circle{fill:none;stroke-width:10;stroke-linecap:round}.kr .big .fg{transition:stroke-dashoffset 1.6s var(--sp)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 14px}.kv div{background:var(--c1);border-radius:16px;padding:12px 14px;animation:gir .5s var(--sp) both}
.kv small{color:var(--mu);font-size:12px;font-weight:700}.kv b{display:block;font-size:24px;margin-top:2px;letter-spacing:-.4px}
.kb{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0}.kb .bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--c3);overflow:hidden}.kb .bar i{display:block;height:100%;transition:width 1.2s var(--sp)}
h3{font-size:20px;font-weight:800;padding:18px 16px 10px;letter-spacing:-.3px}
/* ara */
.ara{margin:0 16px 14px;display:flex;align-items:center;gap:8px;background:var(--c1);border-radius:12px;padding:10px 12px}
.ara input{flex:1;background:none;border:0;color:#fff;font-size:17px;outline:0;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 100px);transform:translate(-50%,30px);opacity:0;z-index:95;background:#2c2c2e;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:all .4s var(--sp);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.ptr{height:0;overflow:hidden;text-align:center;color:var(--mu);font-size:13px;transition:height .25s}
</style>
</head>
<body>
<div class="mini" id="mini">Kırılımlar</div>
<div id="ada"><div class="bl" style="margin:0;padding:0;background:none;animation:none"><div class="ic">⚡</div></div><div><b id="adaB"></b><p id="adaP"></p></div></div>
<div class="toast" id="toast"></div>

<!-- KIRILIMLAR -->
<section class="scr" id="s-ana">
  <div class="ptr" id="ptr">↻ yenileniyor…</div>
  <div class="lt"><h1>Kırılımlar</h1><div class="av">A</div></div>
  <div class="sub" id="anaSub">yükleniyor…</div>
  <div class="st" id="hik"></div>
  <div class="hero" id="hero"><small>BUGÜN</small><div class="n"><span class="num" id="hN">0</span> kırılım <span class="up" id="hW"></span></div><p id="hP">—</p></div>
  <div class="seg" id="seg"><i></i><button data-k="yak">Yaklaşan</button><button data-k="kir">Kırılan</button><button data-k="hep">Tümü</button></div>
  <div id="liste"><div class="isk"></div><div class="isk"></div><div class="isk"></div></div>
</section>

<!-- CANLI -->
<section class="scr gizli" id="s-canli">
  <div class="lt"><h1>Canlı</h1></div>
  <div class="sub"><span class="canlinokta"></span><span id="cP">3 sn'de bir yenilenir</span></div>
  <div class="cg" id="cG"></div>
</section>

<!-- BİLDİRİMLER -->
<section class="scr gizli" id="s-bil">
  <div class="lt"><h1>Bildirimler</h1></div>
  <div class="sub">Kanala giden her mesaj burada</div>
  <button class="btn" id="pushBtn">🔔 Telefona bildirim gelsin</button>
  <div id="bL"></div>
</section>

<!-- KARNE -->
<section class="scr gizli" id="s-karne">
  <div class="lt"><h1>Karne</h1></div>
  <div class="sub">Kazanan da kaybeden de sayılır</div>
  <div id="kA"></div>
</section>

<!-- ARA -->
<section class="scr gizli" id="s-ara">
  <div class="lt"><h1>Ara</h1></div>
  <div class="sub">Hisse kodunu yaz</div>
  <div class="ara"><span class="mu">⌕</span><input id="araI" placeholder="ör. AIOK" autocapitalize="characters" autocomplete="off" maxlength="6"></div>
  <div id="araL"></div>
</section>

<!-- HİSSE DETAYI -->
<div id="det"></div>
<div class="cta" id="cta"><button id="ctaA">🔔 Kırılınca haber ver</button><button id="ctaP">Paylaş</button></div>

<nav class="tab" id="tab">
  <button data-t="ana" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Kırılımlar</button>
  <button data-t="canli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>Canlı</button>
  <button data-t="bil"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3.5a2 2 0 0 0-4 0v.8A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>Bildirimler<span class="rozet" id="bR"></span></button>
  <button data-t="karne"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1.2"/><rect x="10" y="7" width="4" height="14" rx="1.2"/><rect x="17" y="3" width="4" height="18" rx="1.2"/></svg>Karne</button>
  <button data-t="ara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Ara</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fp=x=>x==null||isNaN(x)?'—':(+x).toFixed(Math.abs(x)<1?4:2).replace('.',',');
const fy=x=>x==null||isNaN(x)?'—':(x>0?'+':x<0?'−':'')+'%'+Math.abs(x).toFixed(1).replace('.',',');
const titre=(ms=10)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}try{TG&&TG.HapticFeedback&&TG.HapticFeedback.impactOccurred('light')}catch(e){}};
const TG=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)?Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#000000');TG.setBackgroundColor&&TG.setBackgroundColor('#000000')}catch(e){}}
async function gJ(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location.reload();throw new Error('giriş')}return r.json()}
async function pJ(u,b,m='POST'){const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}
function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
function ada(b,p){$('adaB').textContent=b;$('adaP').textContent=p;const e=$('ada');e.classList.add('on');titre(20);clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),4200)}

  $('cG').innerHTML=(d.liste||[]).map((x,i)=>{const cl=x.st==='kırıldı'?'kir':x.st==='yaklaşıyor'?'yak':x.st==='sahte'?'sah':x.st==='stop'?'stp':'';const o=cOnce[x.sym];if(o&&o!==x.st&&(x.st==='kırıldı'||x.st==='yaklaşıyor')){ada(x.st==='kırıldı'?`🟢 ${x.sym} kırıldı`:`🎯 ${x.sym} yaklaşıyor`,`${fp(x.px)} · kırılım ${fp(x.giris)}`)}cOnce[x.sym]=x.st;
    const u=x.uzak==null?null:Math.max(0,x.uzak),w=x.st==='kırıldı'?100:u==null?0:Math.max(4,100-u/6*100);
    return `<div class="cc ${cl}" data-s="${x.sym}" style="animation-delay:${i*30}ms"><div class="s">${esc(x.sym)}${x.kanal?' 📣':''}</div><div class="p num">${fp(x.px)}</div><div class="l">${x.st==='kırıldı'?`✅ kırıldı ${fp(x.giris)}${x.pct!=null?' · '+fy(x.pct):''}`:x.st==='sahte'?'❌ sahte kırılım':x.st==='stop'?'🛑 stop':`kırılım ${fp(x.giris)} · %${u==null?'—':u.toFixed(1).replace('.',',')} kaldı`}</div><div class="bar"><i style="width:${w}%"></i></div></div>`}).join('')||'<div class="bos" style="grid-column:1/-1"><div class="e">📡</div>Şu an izlenen plan yok.</div>';
  for(const c of $('cG').querySelectorAll('.cc'))c.style.animation='none'}catch(e){}}
$('cG').onclick=e=>{const c=e.target.closest('.cc');if(c)detayAc(c.dataset.s)};
/* ---------------- bildirimler */
let bilSon=+(localStorage.getItem('bilSon')||0),bilIlk=true;
async function bilYukle(){try{const d=await gJ('/api/bildirim');const L=d.liste||[];
  $('bL').innerHTML=L.map((x,i)=>`<div class="bl" data-s="${esc(x.sym)}" style="animation-delay:${Math.min(i,12)*35}ms"><div class="ic">${(x.b||'⚡').match(/^\p{Extended_Pictographic}/u)?.[0]||'⚡'}</div><div style="flex:1;min-width:0"><small>${new Date(x.t*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small><b>${esc((x.b||'').replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,''))}</b><p>${esc(x.a||'')}</p></div></div>`).join('')||'<div class="bos"><div class="e">🔕</div>Bugün kanala henüz mesaj gitmedi.</div>';
  const yeni=L.filter(x=>x.t>bilSon);if(sekme!=='bil'){const r=$('bR');if(yeni.length){r.textContent=yeni.length;r.style.display='grid'}else r.style.display='none';if(!bilIlk&&yeni.length&&yeni[0].t>(bilYukle._son||0))ada(yeni[0].b,yeni[0].a)}
  bilYukle._son=L[0]?L[0].t:0;bilIlk=false}catch(e){}}
function okundu(){bilSon=Math.floor(Date.now()/1000);try{localStorage.setItem('bilSon',bilSon)}catch(e){}$('bR').style.display='none'}
$('bL').onclick=e=>{const b=e.target.closest('.bl');if(b&&b.dataset.s)detayAc(b.dataset.s)};
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))};
$('pushBtn').onclick=async()=>{titre();try{if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error("iPhone'da siteyi Paylaş → Ana Ekrana Ekle ile ekleyip oradan aç");
  const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('bildirim izni verilmedi');const reg=await navigator.serviceWorker.ready,k=await gJ('/push/key');if(!k.key)throw new Error('sunucuda bildirim kapalı');
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});const r=await pJ('/push/sub',sub.toJSON());if(!r.ok)throw new Error('kaydedilemedi');
  toast('🔔 Bildirimler açıldı');$('pushBtn').textContent='✓ Bildirimler açık'}catch(e){toast('Bildirim açılamadı: '+esc(e.message||e))}};
/* ---------------- karne */
async function karneYukle(){try{const d=await gJ('/api/kk');KK=d;KK._t=Date.now();const K=d.karne||{},B=d.bugun||{},C=2*Math.PI*48,w=K.wr||0;
  $('kA').innerHTML=`<div class="kr"><div class="big"><svg width="110" height="110"><circle cx="55" cy="55" r="48" stroke="#3a3a3c"/><circle class="fg" id="kRing" cx="55" cy="55" r="48" stroke="${w>=50?'#30d158':'#ff453a'}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b class="num"><span id="kW">0</span><small>%</small></b></div>
   <div><div style="font-size:13px;color:var(--mu);font-weight:700">K1+ ORANI</div><div style="font-size:15px;margin-top:4px">Son ${K.kirilan||0} kırılımın<br>${K.kazanan||0} tanesi hedefe ulaştı</div></div></div>
  <div class="kv"><div><small>ORT. TEPE</small><b class="${(K.ort_tepe||0)>0?'up':''}">${fy(K.ort_tepe)}</b></div><div style="animation-delay:.05s"><small>BUGÜN</small><b>${B.kirilan||0}/${B.gonderilen||0}</b></div><div style="animation-delay:.1s"><small>KAZANAN</small><b class="up">${K.kazanan||0}</b></div><div style="animation-delay:.15s"><small>KAYBEDEN</small><b class="dn">${K.kaybeden||0}</b></div></div>
  ${(d.kural||[]).length?`<h3>Hangi kural kazandırdı</h3><div class="cd">${d.kural.slice(0,8).map(x=>`<div class="kb"><span style="font-size:14px">${esc(x.kural)}</span><b class="${x.wr>=50?'up':'dn'}">%${x.wr}</b><div class="bar"><i data-w="${x.wr}" style="width:0;background:${x.wr>=50?'var(--up)':'var(--dn)'}"></i></div></div>`).join('')}</div>`:''}
  <h3>Son kırılımlar</h3><div class="cd">${(K.liste||[]).slice(0,15).map(r=>`<div class="r" onclick="detayAc('${r.sym}')"><span><b>${esc(r.sym)}</b> <span class="mu" style="font-size:13px">${esc(r.gun.slice(5).split('-').reverse().join('.'))} · ${fp(r.giris)}</span></span><span class="${r.renk==='up'?'up':r.renk==='dn'?'dn':'mu'}">${esc(r.sonuc)}</span></div>`).join('')||'<div class="mu">Henüz kayıt yok.</div>'}</div>
  ${(d.ders||[]).length?`<h3>Haftanın dersleri</h3>${d.ders.map(x=>`<div class="cd"><div style="font-weight:700;margin-bottom:6px">${x.iyi?'✅':'❌'} ${esc(x.sym)} <span class="mu" style="font-weight:500">${esc(x.sonuc)}</span></div><div class="mu" style="font-size:14px;line-height:1.5">${x.neden.map(esc).join('<br>')}</div><div style="margin-top:8px;font-size:14px">💡 ${esc(x.ders)}</div></div>`).join('')}`:''}
  ${(d.saglik||[]).length?`<h3>Bot sağlığı</h3><div class="cd">${d.saglik.map(s=>`<div class="r" style="font-size:13px">${esc(s)}</div>`).join('')}</div>`:''}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('kRing').style.strokeDashoffset=C*(1-w/100);sayac($('kW'),w,1400);for(const i of $('kA').querySelectorAll('[data-w]'))i.style.width=i.dataset.w+'%'}))}catch(e){}}
/* ---------------- ara */
$('araI').addEventListener('input',()=>{const q=$('araI').value.toUpperCase().replace(/[^A-Z.]/g,'');$('araI').value=q;const L=CANLI.filter(x=>x.sym.startsWith(q));
  $('araL').innerHTML=(q?`<div class="row" data-s="${q}"><div class="n"><b>${esc(q)}</b><small>hisseyi aç</small></div><div class="pr n">›</div></div>`:'')+L.filter(x=>x.sym!==q).map(x=>`<div class="row" data-s="${x.sym}"><div class="n"><b>${esc(x.sym)}</b><small>kırılım ${fp(x.giris)}</small></div><div class="pr num ${durum(x)}">${fp(x.px)}</div></div>`).join('')});
$('araI').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('araI').value)detayAc($('araI').value)});
$('araL').onclick=e=>{const r=e.target.closest('.row');if(r)detayAc(r.dataset.s)};
/* ---------------- başlat */
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
segAyarla();anaYukle();bilYukle();setInterval(()=>{if(sekme==='ana'&&!DS)anaYukle()},5000);setInterval(bilYukle,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){anaYukle();bilYukle()}});
</script>
