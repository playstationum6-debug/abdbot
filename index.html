<script>
const $=id=>document.getElementById(id);

async function gJ(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location.reload();throw new Error('giriş')}return r.json()}
async function pJ(u,b,m='POST'){const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}

function konfeti(n=28){const cs=['#2ee59d','#3ad7ff','#7c6cff','#ffbe3d','#ff4d6d'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.style.left=(Math.random()*100)+'%';d.style.background=cs[i%5];d.style.setProperty('--x',(Math.random()*120-60)+'px');d.style.setProperty('--r',(Math.random()*900-450)+'deg');d.style.animationDelay=Math.random()*.35+'s';$('konf').appendChild(d);setTimeout(()=>d.remove(),2400)}}

function spark(v,w=58,h=28){if(!v||v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;const pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(x-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  const c=v[v.length-1]>=v[0]?'#2ee59d':'#ff4d6d';return `<svg class="sp" width="${w}" height="${h}" style="flex:none"><polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/></svg>`}

let CANLI=[],segK='yak',fiyatOnce={};
function segAyarla(){const bs=[...$('seg').querySelectorAll('button')],i=bs.findIndex(b=>b.dataset.k===segK),w=($('seg').clientWidth-10)/bs.length;
  const p=$('seg').querySelector('i');p.style.width=w+'px';p.style.transform=`translateX(${i*w}px)`;bs.forEach((b,j)=>b.classList.toggle('on',j===i))}
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;titre();segK=b.dataset.k;segAyarla();listeCiz(true)};

function durum(x){return x.st==='kırıldı'?'g':x.st==='yaklaşıyor'?'y':x.st==='sahte'||x.st==='stop'?'r':'n'}
function listeCiz(anim){let L=CANLI;if(segK==='yak')L=L.filter(x=>x.st==='yaklaşıyor'||x.st==='bekliyor');if(segK==='kir')L=L.filter(x=>x.st==='kırıldı'||x.st==='sahte'||x.st==='stop');
  if(!L.length){$('liste').innerHTML=`<div class="bos"><div class="e">${segK==='kir'?'🌱':'🔭'}</div><br>${segK==='kir'?'Bugün henüz kırılım yok.':'Şu an girişe yaklaşan hisse yok.<br>Bot piyasayı tarıyor.'}</div>`;return}
  const eski={};for(const r of $('liste').querySelectorAll('.row'))eski[r.dataset.s]=1;
  $('liste').innerHTML=L.map((x,i)=>{const d=durum(x);
    const alt=x.st==='kırıldı'?`giriş planı ${fp(x.giris)} kırıldı${x.tepe!=null?' · zirve '+fy(x.tepe):''}`:x.st==='sahte'?'sahte kırılım':x.st==='stop'?'stop oldu':`giriş ${fp(x.giris)}${x.ab!=null?' · alım %'+x.ab:''}`;
    const sag=x.st==='kırıldı'?`<small class="up">${fy(x.tepe!=null?x.tepe:x.pct)}</small>`:x.st==='sahte'||x.st==='stop'?`<small class="dn">${x.st==='stop'?'stop':'sahte'}</small>`:`<small class="am">${x.uzak!=null?'%'+Math.max(0,x.uzak).toFixed(1).replace('.',',')+' kaldı':''}</small>`;
    return `<div class="row" data-s="${x.sym}" style="animation-delay:${anim||!eski[x.sym]?i*45:0}ms;${!anim&&eski[x.sym]?'animation:none':''}"><div class="lg ${d}">${esc(x.sym.slice(0,5))}</div><div class="n"><b>${esc(x.sym)}${x.kanal?' <span style="font-size:12px">📣</span>':''}</b><small>${esc(alt)}</small></div>${spark(x.sp)}<div class="pr"><b class="num" id="pr-${x.sym}">${fp(x.px)}</b>${sag}</div></div>`}).join('');
  for(const x of L){const o=fiyatOnce[x.sym],e=$('pr-'+x.sym);if(e&&o!=null&&x.px!=null&&o!==x.px){e.classList.add(x.px>o?'flU':'flD')}fiyatOnce[x.sym]=x.px}}
$('liste').onclick=e=>{const r=e.target.closest('.row');if(r)detayAc(r.dataset.s)};
function hikCiz(){const L=CANLI.slice(0,12);$('hik').innerHTML=L.map((x,i)=>{const k=x.st==='kırıldı',y=x.st==='yaklaşıyor',s=x.st==='sahte'||x.st==='stop';
  const ora=k||s?1:Math.max(.06,1-Math.max(0,x.uzak??6)/6),C=2*Math.PI*30,renk=k?'url(#hg)':y?'#ffbe3d':s?'#ff4d6d':'#7c6cff';
  return `<div class="h" data-s="${x.sym}" style="animation-delay:${i*55}ms"><div class="ring ${k?'kir':''} ${y?'yak':''}"><svg width="66" height="66"><defs><linearGradient id="hg"><stop offset="0" stop-color="#2ee59d"/><stop offset="1" stop-color="#3ad7ff"/></linearGradient></defs><circle class="bg" cx="33" cy="33" r="30"/><circle class="fg" cx="33" cy="33" r="30" stroke="${renk}" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${C*(1-ora)}"/></svg><b>${esc(x.sym.slice(0,4))}</b></div>${k&&x.tepe!=null?`<span class="up">${fy(x.tepe)}</span>`:esc(x.sym)}</div>`}).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const c of $('hik').querySelectorAll('.fg'))c.style.strokeDashoffset=c.dataset.o}))}
$('hik').onclick=e=>{const h=e.target.closest('.h');if(h)detayAc(h.dataset.s)};
let ilkAna=true,KK=null,oncekiSt={},tapeK='';
function tapeCiz(){const L=CANLI.filter(x=>x.px!=null).slice(0,14);const k=L.map(x=>x.sym+x.st+(x.tepe||'')).join();if(k===tapeK)return;tapeK=k;if(!L.length){$('tape').style.display='none';return}$('tape').style.display='';
  const h=L.map(x=>{const c=x.st==='kırıldı'?'li':x.st==='sahte'||x.st==='stop'?'dn':'am',t=x.st==='kırıldı'?'▲ '+fy(x.tepe!=null?x.tepe:x.pct):x.st==='sahte'?'sahte':x.st==='stop'?'stop':x.uzak!=null?'%'+Math.max(0,x.uzak).toFixed(1).replace('.',',')+' kaldı':'';return `<span>${esc(x.sym)}<i class="${c}">${t}</i></span>`}).join('');
  $('tape').firstElementChild.innerHTML=h+h}
async function anaYukle(){try{const d=await gJ('/api/canli');CANLI=d.liste||[];$('anaSub').textContent=(new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}))+' · '+(d.piyasa||'piyasa verisi bekleniyor');
  for(const x of CANLI){const o=oncekiSt[x.sym];if(o&&o!==x.st&&x.st==='kırıldı'){ada(`🟢 ${x.sym} kırıldı`,`giriş ${fp(x.giris)} · şimdi ${fp(x.px)}`);konfeti(30)}oncekiSt[x.sym]=x.st}
  if(ilkAna){hikCiz();ilkAna=false}else{for(const x of CANLI){const e=$('pr-'+x.sym);if(!e){hikCiz();break}}}
  tapeCiz();listeCiz(false);const kir=CANLI.filter(x=>x.st==='kırıldı').length,yak=CANLI.filter(x=>x.st==='yaklaşıyor').length;sayac($('hN'),kir);sayac($('hY'),yak);
  const tp=CANLI.map(x=>x.tepe).filter(x=>x!=null);if(tp.length)sayac($('hZ'),Math.max(...tp),1200,fy);
  $('hP').textContent=`${CANLI.length} giriş planı izleniyor`;
  if(!KK||Date.now()-(KK._t||0)>60000){KK=await gJ('/api/kk');KK._t=Date.now();const w=KK.karne&&KK.karne.wr;if(w!=null)sayac($('hW'),w,1200,v=>'%'+Math.round(v))}}catch(e){}}
(function(){const s=$('s-ana');let y0=null;s.addEventListener('touchstart',e=>{y0=s.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  s.addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(d>0)$('ptr').style.height=Math.min(48,d/2.5)+'px'},{passive:true});
  s.addEventListener('touchend',async()=>{if(y0!=null&&parseInt($('ptr').style.height)>=44){titre(15,'medium');ilkAna=true;await anaYukle()}$('ptr').style.height='0';y0=null})})();
/* ---------------- hisse sayfası */
let DS=null,DT=null,DD=null,dAral='1';
const AUR='';

  $('det').classList.add('on');document.querySelector('.scr:not(.gizli)').classList.add('itik');$('det').scrollTop=0;detayYukle(true);clearInterval(DT);DT=setInterval(()=>detayYukle(false),4000);
  if(TG&&TG.BackButton){TG.BackButton.show();TG.BackButton.onClick(detayKapat)}history.pushState({d:1},'')}

  $('det').addEventListener('touchmove',e=>{if(x0==null)return;const d=Math.max(0,e.touches[0].clientX-x0);$('det').style.transition='none';$('det').style.transform=`translateX(${d}px)`},{passive:true});
  $('det').addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;$('det').style.transition='';$('det').style.transform='';if(d>110)detayKapat();x0=null})})();
/* ---------- mum grafiği */
function mumlar(B,n){n=+n||1;if(n===1)return B;const o=[];let g=null;for(const b of B){const k=Math.floor(b[0]/(n*60));if(!g||g.k!==k){g={k,b:[k*n*60,b[1],b[2],b[3],b[4],b[5]]};o.push(g.b)}else{g.b[2]=Math.max(g.b[2],b[2]);g.b[3]=Math.min(g.b[3],b[3]);g.b[4]=b[4];g.b[5]+=b[5]}}return o}
const CU='#3ee08f',CD='#ff5a6e';
class Mum{constructor(kap){this.k=kap;this.c=document.createElement('canvas');kap.appendChild(this.c);this.x=this.c.getContext('2d');this.B=[];this.L=[];this.M=[];this.Z=null;this.an=0;this.hx=null;this.son=null;this.nb=0;
  this.boyut();this._r=()=>{this.boyut();this.ciz()};window.addEventListener('resize',this._r);
  const go=e=>{const t=e.touches?e.touches[0]:e,r=this.c.getBoundingClientRect();this.hx=t.clientX-r.left;this.hy=t.clientY-r.top;this.ciz();if(e.touches)titre(4)};

  this.uyan()}
 uyan(){if(this.raf)return;const f=t=>{this.raf=0;if(!this.k.isConnected)return;this.nb=t;if(this.an<1)this.an=Math.min(1,this.an+0.035);this.ciz();if(this.an<1||(this.son&&performance.now()-this.son.s<650))this.raf=requestAnimationFrame(f)};this.raf=requestAnimationFrame(f)}
 boyut(){const d=window.devicePixelRatio||1,w=this.k.clientWidth||360,h=300;this.W=w;this.H=h;this.c.width=w*d;this.c.height=h*d;this.c.style.width=w+'px';this.c.style.height=h+'px';this.x.setTransform(d,0,0,d,0,0)}

  ${d.bid!=null?`<div class="r"><span class="up">Alış ${fp(d.bid)}</span><span class="dn">Satış ${fp(d.ask)}</span></div>`:''}
  ${(d.son||[]).slice(0,8).map((t,i)=>`<div class="ts num" style="${eskiS&&eskiS.includes(t[0]+''+t[2])?'animation:none':'animation-delay:'+i*40+'ms'}"><span class="${t[3]>0?'up':t[3]<0?'dn':'mu'}">● ${t[3]>0?'ALIŞ':t[3]<0?'SATIŞ':'aynı'}</span><span>${fp(t[1])}</span><span class="mu">${t[2]}</span></div>`).join('')}`}
$('ctaA').onclick=async()=>{if(!DD)return;titre(15,'medium');const f=$('ctaA').dataset.f||prompt('Alarm fiyatı',fp(DD.p));if(!f)return;try{const r=await pJ('/api/alarm',{sym:DD.sym,fiyat:String(f).replace(',','.')});if(r.ok){konfeti();titre(20,'ok')}toast(r.ok?'🔔 Alarm kuruldu · '+DD.sym+' '+fp(+String(f).replace(',','.')):'Alarm kurulamadı');detayYukle(true)}catch(e){toast('Alarm kurulamadı')}};
async function alarmSil(id){titre();await pJ('/api/alarm/'+id,null,'DELETE');detayYukle(true)}
function paylas(){if(!DD)return;const z=(DD.girseydin||[]).find(g=>g.tepe!=null);const t=`#${DD.sym} ${fp(DD.p)}${z?' · kırılımdan zirve '+fy(z.tepe):DD.plan?' · giriş '+fp(DD.plan.giris):''} — ABD·BOT`;if(navigator.share)navigator.share({title:'ABD·BOT',text:t,url:location.origin+'/h/'+DD.sym}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t+' '+location.origin+'/h/'+DD.sym);toast('Bağlantı kopyalandı')}}
$('ctaP').onclick=paylas;
/* ---------------- canlı */
let cT=null,cOnce={},cIlk=true;
async function canliYukle(){clearInterval(cT);cIlk=true;await canliCiz();cT=setInterval(()=>{if(sekme==='canli')canliCiz();else clearInterval(cT)},3000)}
async function canliCiz(){try{const d=await gJ('/api/canli');$('cP').textContent=(d.piyasa||'')+' · '+new Date().toLocaleTimeString('tr-TR');
  $('cG').innerHTML=(d.liste||[]).map((x,i)=>{const cl=x.st==='kırıldı'?'kir':x.st==='yaklaşıyor'?'yak':x.st==='sahte'?'sah':x.st==='stop'?'stp':'';const o=cOnce[x.sym];if(o&&o!==x.st&&(x.st==='kırıldı'||x.st==='yaklaşıyor')){ada(x.st==='kırıldı'?`🟢 ${x.sym} kırıldı`:`🎯 ${x.sym} yaklaşıyor`,`${fp(x.px)} · giriş ${fp(x.giris)}`);if(x.st==='kırıldı')konfeti(30)}cOnce[x.sym]=x.st;
    const u=x.uzak==null?null:Math.max(0,x.uzak),w=x.st==='kırıldı'?100:u==null?0:Math.max(4,100-u/6*100);
    return `<div class="gl cc ${cl}" data-s="${x.sym}" style="${cIlk?'animation:in .6s var(--bo) both;animation-delay:'+i*45+'ms':''}"><div class="s">${esc(x.sym)}<span style="font-size:13px">${x.kanal?'📣':''}</span></div><div class="p num">${fp(x.px)}</div><div class="l">${x.st==='kırıldı'?`✅ kırıldı · zirve ${fy(x.tepe!=null?x.tepe:x.pct)}`:x.st==='sahte'?'❌ sahte kırılım':x.st==='stop'?'🛑 stop':`giriş ${fp(x.giris)} · %${u==null?'—':u.toFixed(1).replace('.',',')} kaldı`}</div><div class="bar"><i style="width:${w}%"></i></div></div>`}).join('')||'<div class="bos" style="grid-column:1/-1"><div class="e">📡</div><br>Şu an izlenen giriş planı yok.</div>';cIlk=false}catch(e){}}
$('cG').onclick=e=>{const c=e.target.closest('.cc');if(c)detayAc(c.dataset.s)};
/* ---------------- bildirimler */
let bilSon=+(localStorage.getItem('bilSon')||0),bilIlk=true;
async function bilYukle(){try{const d=await gJ('/api/bildirim');const L=d.liste||[];
  $('bL').innerHTML=L.map((x,i)=>`<div class="gl bl" data-s="${esc(x.sym)}" style="animation-delay:${Math.min(i,12)*45}ms"><div class="ic">${(x.b||'⚡').match(/^\p{Extended_Pictographic}/u)?.[0]||'⚡'}</div><div style="flex:1;min-width:0"><small>${new Date(x.t*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</small><b>${esc((x.b||'').replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,''))}</b><p>${esc(x.a||'')}</p></div></div>`).join('')||'<div class="bos"><div class="e">🔕</div><br>Bugün kanala henüz mesaj gitmedi.</div>';
  const yeni=L.filter(x=>x.t>bilSon);if(sekme!=='bil'){const r=$('bR');if(yeni.length){r.textContent=yeni.length;r.style.display='grid'}else r.style.display='none';if(!bilIlk&&yeni.length&&yeni[0].t>(bilYukle._son||0))ada(yeni[0].b,yeni[0].a)}
  bilYukle._son=L[0]?L[0].t:0;bilIlk=false}catch(e){}}
function okundu(){bilSon=Math.floor(Date.now()/1000);try{localStorage.setItem('bilSon',bilSon)}catch(e){}$('bR').style.display='none'}
$('bL').onclick=e=>{const b=e.target.closest('.bl');if(b&&b.dataset.s)detayAc(b.dataset.s)};
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))};
$('pushBtn').onclick=async()=>{titre();try{if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error("iPhone'da siteyi Paylaş → Ana Ekrana Ekle ile ekleyip oradan aç");
  const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('bildirim izni verilmedi');const reg=await navigator.serviceWorker.ready,k=await gJ('/push/key');if(!k.key)throw new Error('sunucuda bildirim kapalı');
  let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});const r=await pJ('/push/sub',sub.toJSON());if(!r.ok)throw new Error('kaydedilemedi');
  konfeti();toast('🔔 Bildirimler açıldı');$('pushBtn').textContent='✓ Bildirimler açık'}catch(e){toast('Bildirim açılamadı: '+esc(e.message||e))}};
/* ---------------- karne */
function gunKazanc(B){const L=(B.liste||[]).filter(r=>r.tepe_pct!=null&&!['kırılmadı','bekliyor','onaysız'].includes(r.st));if(!L.length)return '';
  const top=L.reduce((t,r)=>t+Math.round(2.5*r.tepe_pct),0);
  return `<div class="gl gs in"><div class="tp"><span style="font-size:11.5px;color:var(--mu);font-weight:800;letter-spacing:1.2px">BUGÜN · KIRILIMDAN ZİRVEYE</span></div><div class="tp"><b class="num">${top>=0?'+':''}${top}$</b><span class="mu" style="font-size:12.5px">her plana 250$</span></div>
   ${L.map((r,i)=>{const z=Math.max(r.tepe||0,r.zirve||0)||r.giris*(1+r.tepe_pct/100),u=Math.round(2.5*r.tepe_pct);return `<div class="row" onclick="detayAc('${r.sym}')" style="animation-delay:${i*45}ms;padding:9px 0"><div class="lg ${r.geri?'y':r.tepe_pct>0&&r.st!=='sahte'?'g':'r'}" style="width:40px;height:40px">${esc(r.sym.slice(0,5))}</div><div class="n"><b>${esc(r.sym)}</b><small>${fp(r.giris)} → ${fp(z)} · ${r.geri?'<span class="am">↩ altına döndü</span>':esc(r.sonuc)}</small></div><div class="pr"><b class="${r.geri?'am':r.tepe_pct>0?'li':'dn'}">${fy(r.tepe_pct)}</b><small class="mu">${u>=0?'+':''}${u}$</small></div></div>`}).join('')}</div>`}
async function karneYukle(){try{const d=await gJ('/api/kk');KK=d;KK._t=Date.now();const K=d.karne||{},B=d.bugun||{},C=2*Math.PI*50,w=K.wr||0,rk=w>=50?'#2ee59d':'#ff4d6d';
  $('kA').innerHTML=`<div class="gl kr in"><div class="bg2"><svg width="116" height="116"><circle cx="58" cy="58" r="50" stroke="rgba(255,255,255,.07)"/><circle class="fg" id="kRing" cx="58" cy="58" r="50" stroke="${rk}" style="color:${rk}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b class="num"><span id="kW">0</span><small>%</small></b></div>
   <div><div style="font-size:12px;color:var(--mu);font-weight:800;letter-spacing:1px">K1+ ORANI</div><div style="font-size:15px;margin-top:6px;line-height:1.45">Son <b>${K.kirilan||0}</b> kırılımın<br><b class="up">${K.kazanan||0}</b> tanesi hedefe ulaştı</div></div></div>
  <div class="kv"><div class="gl"><small>ORT. ZİRVE</small><b class="${(K.ort_tepe||0)>0?'up':''} num" id="kZ">—</b></div><div class="gl" style="animation-delay:.06s"><small>BUGÜN</small><b class="num">${B.kirilan||0}/${B.gonderilen||0}</b></div><div class="gl" style="animation-delay:.12s"><small>KAZANAN</small><b class="up num" id="kK">0</b></div><div class="gl" style="animation-delay:.18s"><small>KAYBEDEN</small><b class="dn num" id="kY">0</b></div></div>
  ${gunKazanc(B)}
  ${(d.kural||[]).length?`<h3>Hangi kural kazandırdı</h3><div class="gl cd">${d.kural.slice(0,8).map(x=>`<div class="kb"><span style="font-size:14px">${esc(x.kural)}</span><b class="${x.wr>=50?'up':'dn'}">%${x.wr}</b><div class="bar"><i data-w="${x.wr}" style="width:0;background:${x.wr>=50?'var(--grad)':'var(--dn)'}"></i></div></div>`).join('')}</div>`:''}
  <h3>Son kırılımlar</h3><div class="gl cd" style="padding:6px 8px">${(K.liste||[]).slice(0,15).map((r,i)=>`<div class="row" onclick="detayAc('${r.sym}')" style="animation-delay:${i*40}ms;padding:9px 8px"><div class="lg ${r.renk==='up'?'g':r.renk==='dn'?'r':'n'}" style="width:40px;height:40px">${esc(r.sym.slice(0,5))}</div><div class="n"><b>${esc(r.sym)}</b><small>${esc(r.gun.slice(5).split('-').reverse().join('.'))} · giriş ${fp(r.giris)}</small></div><div class="pr"><b class="${r.tepe_pct>0?'up':''}" style="font-size:15px">${r.tepe_pct!=null?fy(r.tepe_pct):''}</b><small class="${r.renk==='up'?'up':r.renk==='dn'?'dn':'mu'}">${esc(r.sonuc)}</small></div></div>`).join('')||'<div class="mu" style="padding:10px">Henüz kayıt yok.</div>'}</div>
  ${(d.ders||[]).length?`<h3>Haftanın dersleri</h3>${d.ders.map((x,i)=>`<div class="gl cd" style="animation-delay:${i*60}ms"><div style="font-weight:800;margin-bottom:6px">${x.iyi?'✅':'❌'} ${esc(x.sym)} <span class="mu" style="font-weight:500">${esc(x.sonuc)}</span></div><div class="mu" style="font-size:14px;line-height:1.5">${x.neden.map(esc).join('<br>')}</div><div style="margin-top:8px;font-size:14px">💡 ${esc(x.ders)}</div></div>`).join('')}`:''}
  ${(d.saglik||[]).length?`<h3>Bot sağlığı</h3><div class="gl cd">${d.saglik.map(s=>`<div class="r" style="font-size:13px">${esc(s)}</div>`).join('')}</div>`:''}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$('kRing').style.strokeDashoffset=C*(1-w/100);sayac($('kW'),w,1600);sayac($('kK'),K.kazanan||0,1200);sayac($('kY'),K.kaybeden||0,1200);if(K.ort_tepe!=null)sayac($('kZ'),K.ort_tepe,1400,fy);for(const i of $('kA').querySelectorAll('[data-w]'))i.style.width=i.dataset.w+'%';if(w>=60)konfeti(24)}))}catch(e){}}
/* ---------------- ara */
$('araI').addEventListener('input',()=>{const q=$('araI').value.toUpperCase().replace(/[^A-Z.]/g,'');$('araI').value=q;const L=CANLI.filter(x=>x.sym.startsWith(q));
  $('araL').innerHTML='<div style="padding:0 10px">'+(q?`<div class="row" data-s="${q}"><div class="lg n">${esc(q.slice(0,5))}</div><div class="n"><b>${esc(q)}</b><small>hisse sayfasını aç</small></div><div class="pr"><b>›</b></div></div>`:'')+L.filter(x=>x.sym!==q).map((x,i)=>`<div class="row" data-s="${x.sym}" style="animation-delay:${i*40}ms"><div class="lg ${durum(x)}">${esc(x.sym.slice(0,5))}</div><div class="n"><b>${esc(x.sym)}</b><small>giriş ${fp(x.giris)}</small></div><div class="pr"><b class="num">${fp(x.px)}</b></div></div>`).join('')+'</div>'});
$('araI').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('araI').value)detayAc($('araI').value)});
$('araL').onclick=e=>{const r=e.target.closest('.row');if(r)detayAc(r.dataset.s)};
/* ---------------- başlat */
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
segAyarla();indAyarla();anaYukle();bilYukle();setInterval(()=>{if(sekme==='ana'&&!DS)anaYukle()},5000);setInterval(bilYukle,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){anaYukle();bilYukle()}});
</script>
</body>
</html>
